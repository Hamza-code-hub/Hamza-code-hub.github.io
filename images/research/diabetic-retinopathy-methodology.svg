<text x="68.0" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Retinal feature learning</text>
<text x="68.0" y="511" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Convolution + pooling</text>
