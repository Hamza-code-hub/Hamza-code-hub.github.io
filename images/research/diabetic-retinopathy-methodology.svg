<text x="634.0" y="1137" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">APTOS benchmark evaluation</text>
<text x="634.0" y="1174" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Accuracy / precision / recall / F1</text>
<text x="634.0" y="1203" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">CHiVE 98.91%; Swin-T 83.45% accuracy</text>
<text x="634.0" y="1232" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Component ablations + ROC analysis</text><text x="44" y="1328" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">Original conceptual redraw. Arrows summarize information flow; consult the paper for the complete</text><text x="44" y="1353" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">architecture and protocol.</text></g>
