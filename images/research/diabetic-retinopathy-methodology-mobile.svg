<svg xmlns="http://www.w3.org/2000/svg" width="680" height="2090" viewBox="0 0 680 2090" role="img" aria-labelledby="title description">
<title id="title">CHiVE: Diabetic retinopathy: methodology flowchart</title>
<desc id="description">APTOS retinal fundus images feed the compact hierarchical vision encoder CHiVE. Convolution and pooling, a Swish-inspired Nonlinear Unit, a Layer-wise Normalization Scheme and a Stochastic Regularization Module support five-class severity grading. The author confirms label-smoothed cross-entropy with coefficient 0.01 plus L2 regularization. The diagram groups components and does not assert an exact layer order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f0c46d"/></marker></defs>
<rect width="680" height="2090" rx="24" fill="#121816"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="26" y="43" fill="#f0c46d" font-size="16" font-weight="600" text-anchor="start">RESEARCH / METHODOLOGY</text><text x="26" y="89" fill="#f1f5ee" font-size="32" font-weight="600" text-anchor="start">CHiVE: Diabetic retinopathy</text><text x="26" y="134" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Stable hierarchical features for five-class</text><text x="26" y="163" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">retinal grading</text><rect x="26" y="219" width="628" height="220" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="50" y="258" fill="#f0c46d" font-size="27" font-weight="600" text-anchor="start">APTOS fundus images</text>
<text x="50" y="295" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Retinal image benchmark</text>
<text x="50" y="324" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Five diabetic retinopathy severity classes</text><path d="M340.0,439 L340.0,479" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="26" y="508" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">HIERARCHICAL ENCODER · COMPONENTS OF ONE MODEL</text><rect x="26" y="534" width="628" height="436" rx="22" fill="none" stroke="#a0dfc1" stroke-dasharray="5 7"/><rect x="38" y="546" width="604" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="62" y="585" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Retinal feature learning</text>
<text x="62" y="622" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Convolution + pooling</text>
<text x="62" y="651" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Swish-inspired Nonlinear Unit</text><rect x="38" y="758" width="604" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="62" y="797" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Training stability</text>
<text x="62" y="834" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Layer-wise Normalization Scheme</text>
<text x="62" y="863" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Stochastic Regularization Module</text><path d="M340.0,974 L340.0,1014" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="1023" width="628" height="230" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="50" y="1062" fill="#f0c46d" font-size="27" font-weight="600" text-anchor="start">Compact hierarchical vision encoder</text>
<text x="50" y="1099" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Integrate hierarchical retinal features</text>
<text x="50" y="1128" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Prepare a compact severity representation</text><path d="M340.0,1253 L340.0,1293" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="1302" width="628" height="198" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="1341" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Five-class severity grading</text>
<text x="50" y="1378" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">No DR / Mild / Moderate</text>
<text x="50" y="1407" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Severe / Proliferative DR</text><text x="26" y="1525" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">TRAINING + EVALUATION CONTEXT</text><rect x="26" y="1546" width="628" height="202" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="1585" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Training objective</text>
<text x="50" y="1622" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Label-smoothed CE; coefficient 0.01</text>
<text x="50" y="1651" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">L2 weight regularization</text><rect x="26" y="1764" width="628" height="202" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="1803" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">APTOS benchmark evaluation</text>
<text x="50" y="1840" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Accuracy / precision / recall / F1</text>
<text x="50" y="1869" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">CHiVE 98.91%; Swin-T 83.45% accuracy</text>
<text x="50" y="1898" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Component ablations + ROC analysis</text><text x="26" y="1999" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">Original conceptual redraw. Arrows summarize</text><text x="26" y="2024" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">information flow; consult the paper for the complete</text><text x="26" y="2049" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">architecture and protocol.</text></g>
</svg>
