<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1394" viewBox="0 0 1200 1394" role="img" aria-labelledby="title description">
<title id="title">Resilient UAV network security: methodology flowchart</title>
<desc id="description">CIC-IDS2017 and UNSW-NB15 traffic feed TabNet for sparse tabular representation and a Transformer encoder for temporal representation. Reciprocal multi-head cross-attention aligns the two streams, followed by residual refinement, temporal aggregation and fusion to classify intrusions. FGSM augments training. These are general network benchmarks, not real UAV flight traffic.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f0c46d"/></marker></defs>
<rect width="1200" height="1394" rx="24" fill="#121816"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="43" fill="#f0c46d" font-size="16" font-weight="600" text-anchor="start">RESEARCH / METHODOLOGY</text><text x="44" y="89" fill="#f1f5ee" font-size="34" font-weight="600" text-anchor="start">Resilient UAV network security</text><text x="44" y="134" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Align sparse attributes with temporal traffic context</text><rect x="44" y="190" width="1112" height="142" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="68" y="229" fill="#f0c46d" font-size="25" font-weight="600" text-anchor="start">Network traffic benchmarks</text>
<text x="68" y="266" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">CIC-IDS2017 + UNSW-NB15</text>
<text x="68" y="295" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Current flow attributes + synchronized traffic history</text><path d="M600.0,332 L600.0,372" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="44" y="401" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">COMPLEMENTARY REPRESENTATION STREAMS</text><path d="M317.0,420 H883.0" fill="none" stroke="#f0c46d" stroke-width="2"/><rect x="44.0" y="435" width="546.0" height="224" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68.0" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">TabNet</text>
<text x="68.0" y="511" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Sparse, attribute-aware representation</text>
<text x="68.0" y="540" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Current traffic features</text><path d="M317.0,420 L317.0,433" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610.0" y="435" width="546.0" height="224" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="634.0" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Transformer encoder</text>
<text x="634.0" y="511" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Temporal sequence representation</text>
<text x="634.0" y="540" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Dynamic traffic context</text><path d="M883.0,420 L883.0,433" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M317.0,659 V674 H883.0 V659" fill="none" stroke="#f0c46d" stroke-width="2"/><path d="M600.0,674 L600.0,703" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="712" width="1112" height="142" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="68" y="751" fill="#f0c46d" font-size="25" font-weight="600" text-anchor="start">Reciprocal multi-head cross-attention</text>
<text x="68" y="788" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Align sparse and temporal features</text>
<text x="68" y="817" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Residual refinement → temporal aggregation + fusion</text><path d="M600.0,854 L600.0,894" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="903" width="1112" height="142" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68" y="942" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Intrusion classification</text>
<text x="68" y="979" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Predict benign or attack class</text>
<text x="68" y="1008" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Assess minority-attack recall and robustness</text><text x="44" y="1077" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">TRAINING + EVALUATION CONTEXT</text><rect x="44.0" y="1098" width="546.0" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68.0" y="1137" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Adversarial training branch</text>
<text x="68.0" y="1174" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">FGSM perturbations</text>
<text x="68.0" y="1203" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Focal + adversarial + sparsity objectives</text><rect x="610.0" y="1098" width="546.0" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="634.0" y="1137" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">General-network evaluation</text>
<text x="634.0" y="1174" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Clean and adversarial performance</text>
<text x="634.0" y="1203" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">UAV-specific flight validation remains</text>
<text x="634.0" y="1232" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">future work</text><text x="44" y="1328" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">Original conceptual redraw. Arrows summarize information flow; consult the paper for the complete</text><text x="44" y="1353" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">architecture and protocol.</text></g>
</svg>
