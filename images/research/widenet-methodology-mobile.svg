<svg xmlns="http://www.w3.org/2000/svg" width="680" height="2364" viewBox="0 0 680 2364" role="img" aria-labelledby="title description">
<title id="title">WIDENet: methodology flowchart</title>
<desc id="description">Dermoscopic RGB images pass through an edge-aware detail extractor and four wavelet transformer downsampling encoder stages. Each stage combines wavelet frequency features with convolution and attention. Bilinear decoding and encoder skip connections feed adaptive variance-weighted feature fusion, then a one-by-one convolution and sigmoid produce the binary lesion mask. The training objective is Dice loss.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f0c46d"/></marker></defs>
<rect width="680" height="2364" rx="24" fill="#121816"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="26" y="43" fill="#f0c46d" font-size="16" font-weight="600" text-anchor="start">RESEARCH / METHODOLOGY</text><text x="26" y="89" fill="#f1f5ee" font-size="32" font-weight="600" text-anchor="start">WIDENet</text><text x="26" y="134" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Preserve detail while learning lesion context</text><rect x="26" y="190" width="628" height="220" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="50" y="229" fill="#f0c46d" font-size="27" font-weight="600" text-anchor="start">Dermoscopic RGB images</text>
<text x="50" y="266" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">PH² / ISIC 2017 / ISIC 2018; 256 × 256 input</text>
<text x="50" y="295" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Edge-aware detail extractor (EDE)</text><path d="M340.0,410 L340.0,450" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="26" y="479" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">FOUR WTDE ENCODER STAGES · COMPLEMENTARY</text><text x="26" y="503" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">FEATURES</text><rect x="26" y="529" width="628" height="436" rx="22" fill="none" stroke="#a0dfc1" stroke-dasharray="5 7"/><rect x="38" y="541" width="604" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="62" y="580" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Wavelet information</text>
<text x="62" y="617" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">DWT approximation + H/V/D detail</text>
<text x="62" y="646" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Convolutional detail features</text><rect x="38" y="753" width="604" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="62" y="792" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Context + refinement</text>
<text x="62" y="829" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Convolution + multi-head attention</text>
<text x="62" y="858" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Residual feed-forward refinement</text><path d="M340.0,969 L340.0,1009" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="1018" width="628" height="230" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="1057" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Fusion inside each WTDE stage</text>
<text x="50" y="1094" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Concatenate + project complementary features</text>
<text x="50" y="1123" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Repeat across four encoder stages</text><path d="M340.0,1248 L340.0,1288" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="1297" width="628" height="230" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="50" y="1336" fill="#f0c46d" font-size="27" font-weight="600" text-anchor="start">Decoder + AVFM</text>
<text x="50" y="1373" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Bilinear upsampling with encoder skip</text>
<text x="50" y="1402" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">connections</text>
<text x="50" y="1431" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Adaptive variance-weighted multi-level</text>
<text x="50" y="1460" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">feature fusion</text><path d="M340.0,1527 L340.0,1567" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="26" y="1576" width="628" height="198" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="1615" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Binary lesion mask</text>
<text x="50" y="1652" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">1 × 1 convolution → sigmoid</text>
<text x="50" y="1681" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Threshold 0.5; output 256 × 256</text><text x="26" y="1799" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">TRAINING + EVALUATION CONTEXT</text><rect x="26" y="1820" width="628" height="202" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="1859" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Training objective</text>
<text x="50" y="1896" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Dice loss</text>
<text x="50" y="1925" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Adam optimization</text><rect x="26" y="2038" width="628" height="202" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="50" y="2077" fill="#f1f5ee" font-size="27" font-weight="600" text-anchor="start">Mask-level evaluation</text>
<text x="50" y="2114" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Dice / IoU / precision / recall</text>
<text x="50" y="2143" fill="#b8c8bb" font-size="24" font-weight="400" text-anchor="start">Compare with segmentation baselines</text><text x="26" y="2273" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">Original conceptual redraw. Arrows summarize</text><text x="26" y="2298" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">information flow; consult the paper for the complete</text><text x="26" y="2323" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">architecture and protocol.</text></g>
</svg>
