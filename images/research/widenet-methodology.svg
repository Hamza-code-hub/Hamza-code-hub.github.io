<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1585" viewBox="0 0 1200 1585" role="img" aria-labelledby="title description">
<title id="title">WIDENet: methodology flowchart</title>
<desc id="description">Dermoscopic RGB images pass through an edge-aware detail extractor and four wavelet transformer downsampling encoder stages. Each stage combines wavelet frequency features with convolution and attention. Bilinear decoding and encoder skip connections feed adaptive variance-weighted feature fusion, then a one-by-one convolution and sigmoid produce the binary lesion mask. The training objective is Dice loss.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f0c46d"/></marker></defs>
<rect width="1200" height="1585" rx="24" fill="#121816"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="43" fill="#f0c46d" font-size="16" font-weight="600" text-anchor="start">RESEARCH / METHODOLOGY</text><text x="44" y="89" fill="#f1f5ee" font-size="34" font-weight="600" text-anchor="start">WIDENet</text><text x="44" y="134" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Preserve detail while learning lesion context</text><rect x="44" y="190" width="1112" height="142" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="68" y="229" fill="#f0c46d" font-size="25" font-weight="600" text-anchor="start">Dermoscopic RGB images</text>
<text x="68" y="266" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">PH² / ISIC 2017 / ISIC 2018; 256 × 256 input</text>
<text x="68" y="295" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Edge-aware detail extractor (EDE)</text><path d="M600.0,332 L600.0,372" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="44" y="401" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">FOUR WTDE ENCODER STAGES · COMPLEMENTARY FEATURES</text><path d="M317.0,420 H883.0" fill="none" stroke="#f0c46d" stroke-width="2"/><rect x="44.0" y="435" width="546.0" height="224" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68.0" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Wavelet information</text>
<text x="68.0" y="511" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">DWT approximation + H/V/D detail</text>
<text x="68.0" y="540" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Convolutional detail features</text><path d="M317.0,420 L317.0,433" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610.0" y="435" width="546.0" height="224" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="634.0" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Context + refinement</text>
<text x="634.0" y="511" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Convolution + multi-head attention</text>
<text x="634.0" y="540" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Residual feed-forward refinement</text><path d="M883.0,420 L883.0,433" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M317.0,659 V674 H883.0 V659" fill="none" stroke="#f0c46d" stroke-width="2"/><path d="M600.0,674 L600.0,703" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="712" width="1112" height="142" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68" y="751" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Fusion inside each WTDE stage</text>
<text x="68" y="788" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Concatenate + project complementary features</text>
<text x="68" y="817" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Repeat across four encoder stages</text><path d="M600.0,854 L600.0,894" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="903" width="1112" height="142" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="68" y="942" fill="#f0c46d" font-size="25" font-weight="600" text-anchor="start">Decoder + AVFM</text>
<text x="68" y="979" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Bilinear upsampling with encoder skip connections</text>
<text x="68" y="1008" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Adaptive variance-weighted multi-level feature fusion</text><path d="M600.0,1045 L600.0,1085" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="1094" width="1112" height="142" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68" y="1133" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Binary lesion mask</text>
<text x="68" y="1170" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">1 × 1 convolution → sigmoid</text>
<text x="68" y="1199" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Threshold 0.5; output 256 × 256</text><text x="44" y="1268" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">TRAINING + EVALUATION CONTEXT</text><rect x="44.0" y="1289" width="546.0" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68.0" y="1328" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Training objective</text>
<text x="68.0" y="1365" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Dice loss</text>
<text x="68.0" y="1394" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Adam optimization</text><rect x="610.0" y="1289" width="546.0" height="196" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="634.0" y="1328" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Mask-level evaluation</text>
<text x="634.0" y="1365" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Dice / IoU / precision / recall</text>
<text x="634.0" y="1394" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Compare with segmentation baselines</text><text x="44" y="1519" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">Original conceptual redraw. Arrows summarize information flow; consult the paper for the complete</text><text x="44" y="1544" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">architecture and protocol.</text></g>
</svg>
