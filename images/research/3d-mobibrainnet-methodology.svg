<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1394" viewBox="0 0 1200 1394" role="img" aria-labelledby="title description">
<title id="title">3D-MobiBrainNet: methodology flowchart</title>
<desc id="description">ADNI brain MRI is processed in parallel axial, coronal and sagittal branches. Depthwise-separable bottlenecks, pooling and feature recalibration feed feature fusion, 3D convolution and pooling, followed by a three-class softmax output. Training uses categorical cross-entropy; test and cross-validation findings are separate.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#f0c46d"/></marker></defs>
<rect width="1200" height="1394" rx="24" fill="#121816"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="43" fill="#f0c46d" font-size="16" font-weight="600" text-anchor="start">RESEARCH / METHODOLOGY</text><text x="44" y="89" fill="#f1f5ee" font-size="34" font-weight="600" text-anchor="start">3D-MobiBrainNet</text><text x="44" y="134" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Three anatomical views, one volumetric classifier</text><rect x="44" y="190" width="1112" height="142" rx="18" fill="#1c2621" stroke="#f0c46d" stroke-width="1.5"/>
<text x="68" y="229" fill="#f0c46d" font-size="25" font-weight="600" text-anchor="start">ADNI volumetric MRI</text>
<text x="68" y="266" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Three complementary anatomical views</text>
<text x="68" y="295" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Research labels: AD, MCI and cognitively normal</text><path d="M600.0,332 L600.0,372" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="44" y="401" fill="#a0dfc1" font-size="16" font-weight="600" text-anchor="start">PARALLEL ANATOMICAL BRANCHES</text><path d="M222.66666666666666,420 H977.3333333333333" fill="none" stroke="#f0c46d" stroke-width="2"/><rect x="44.0" y="435" width="357.3333333333333" height="224" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="68.0" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Axial view</text>
<text x="68.0" y="511" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Depthwise-separable</text>
<text x="68.0" y="540" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">bottlenecks</text>
