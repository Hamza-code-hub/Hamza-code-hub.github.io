<text x="68.0" y="598" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">recalibration</text><path d="M222.66666666666666,420 L222.66666666666666,433" fill="none" stroke="#f0c46d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="421.3333333333333" y="435" width="357.3333333333333" height="224" rx="18" fill="#1c2621" stroke="#435348" stroke-width="1.5"/>
<text x="445.3333333333333" y="474" fill="#f1f5ee" font-size="25" font-weight="600" text-anchor="start">Coronal view</text>
