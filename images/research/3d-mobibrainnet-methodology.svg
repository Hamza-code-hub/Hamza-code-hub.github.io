<text x="634.0" y="1203" fill="#b8c8bb" font-size="21" font-weight="400" text-anchor="start">Five-fold success rate: 90.162%</text><text x="44" y="1328" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">Original conceptual redraw. Arrows summarize information flow; consult the paper for the complete</text><text x="44" y="1353" fill="#b8c8bb" font-size="18" font-weight="400" text-anchor="start">architecture and protocol.</text></g>
