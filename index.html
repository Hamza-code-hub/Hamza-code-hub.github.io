<script>
document.addEventListener('DOMContentLoaded', function() {
    if(document.getElementById('typed-output')) {
        new Typed('#typed-output', {
            strings: ['AI | Python Developer', 'LLM Engineer', 'RAG Specialist', 'AI Researcher', 'ML Engineer'],
            typeSpeed: 60, backSpeed: 40, loop: true
        });
    }
    if(document.getElementById('typed-name')) {
        new Typed('#typed-name', {
            strings: ['Muhammad Hamza'],
            typeSpeed: 80, showCursor: false
        });
    }
    AOS.init({ duration: 800, once: true });
    var toggleBtn = document.getElementById('darkModeToggle');
    if(localStorage.getItem('hamza-theme') === 'dark') {
        document.body.classList.add('dark-mode');
        if(toggleBtn) toggleBtn.innerHTML = '&#9788; Light Mode';
    }
    if(toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            var isDark = document.body.classList.contains('dark-mode');
            this.innerHTML = isDark ? '&#9788; Light Mode' : '&#9790; Dark Mode';
            localStorage.setItem('hamza-theme', isDark ? 'dark' : 'light');
        });
    }
});
<\/script>
